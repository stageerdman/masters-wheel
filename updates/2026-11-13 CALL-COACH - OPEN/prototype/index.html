<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Coach</title>
<style>
  :root {
    --surface: #111214; --panel: #1a1c1f; --text: #ececec; --muted: #8b8f96;
    --border: #2a2d31; --accent: #4f8cff; --ok: #3ecf8e; --warn: #f5a524;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Geist", sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 20px; }
  header { display: flex; align-items: center; gap: 16px; }
  h1 { font-size: 18px; margin: 0; flex: 1; }
  #round { color: var(--muted); }
  button { font: inherit; background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 18px; cursor: pointer; }
  button.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  button:focus-visible { box-shadow: 0 0 0 3px #4f8cff66; }
  #status { color: var(--muted); font-size: 13px; min-height: 1.4em; }
  #status.error { color: #ff6b6b; }

  #questions { display: grid; gap: 10px; }
  .q { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
  .q .text { font-size: 22px; line-height: 1.3; }
  .q .mark { font-size: 12px; padding: 4px 10px; }
  .q .meter { grid-column: 1 / -1; height: 4px; background: var(--border); border-radius: 2px; position: relative; }
  .q .meter i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px; transition: width .15s; }
  .q .meter b { position: absolute; top: -3px; width: 2px; height: 10px; background: var(--warn); }
  .q .score { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
  .q.asked { border-color: var(--ok); }
  .q.asked .text { color: var(--ok); }
  .q.dropped { opacity: .35; }
  #thinking { color: var(--muted); font-size: 14px; }

  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  #transcript { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px;
    height: 160px; overflow-y: auto; font-size: 15px; }
  #transcript .partial { color: var(--muted); }

  #metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .metric { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .metric .v { font-size: 22px; font-variant-numeric: tabular-nums; }
  .metric .l { font-size: 12px; color: var(--muted); }

  #log { width: 100%; border-collapse: collapse; font-size: 13px; }
  #log td, #log th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  #log th { color: var(--muted); font-weight: normal; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--border); white-space: nowrap; }
  .tag.instant { background: #4f8cff33; color: #9cbcff; }
  .tag.ai { background: #3ecf8e33; color: #7fe3b4; }
  .tag.manual { background: #f5a52433; color: #ffc864; }

  .row { display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--muted); }
  input[type=range] { accent-color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Call Coach <span id="round"></span></h1>
    <button id="start">Start</button>
  </header>
  <div id="status">Press Start, allow the microphone, then talk as if you're on a call.</div>

  <section>
    <h2>Ask one of these</h2>
    <div id="questions"></div>
    <div id="thinking"></div>
  </section>

  <section>
    <h2>Live transcript</h2>
    <div id="transcript"></div>
  </section>

  <section>
    <h2>Speed</h2>
    <div id="metrics"></div>
    <div class="row" style="margin-top:10px">
      <label for="threshold">Instant-match threshold</label>
      <input id="threshold" type="range" min="0.5" max="0.95" step="0.01" value="0.72">
      <span id="thresholdValue">0.72</span>
    </div>
  </section>

  <section>
    <h2>Rounds</h2>
    <table id="log">
      <thead><tr><th>#</th><th>Target question</th><th>What you said</th><th>Caught by</th><th>Caught after you stopped</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
